<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">
      <h2>Currency Converter</h2>

      <form id="converterForm">
        <!-- Amount -->
        <div class="amount">
          <p>Enter Amount</p>

          <input
            id="amount"
            type="number"
            value="1"
            min="0"
            placeholder="Enter amount"
          />
        </div>

        <!-- Currency Dropdown -->
        <div class="dropdown">
          <!-- From -->
          <div class="currency-box">
            <p>From</p>

            <div class="select-container">
              <img
                id="fromFlag"
                src="https://flagsapi.com/PK/flat/64.png"
                alt="From Currency"
              />

              <select id="fromCurrency" name="from"></select>
            </div>
          </div>

          <!-- Swap Button -->
          <button
            type="button"
            class="swap-btn"
            id="swapBtn"
            title="Swap Currency"
          >
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
          </button>

          <!-- To -->
          <div class="currency-box">
            <p>To</p>

            <div class="select-container">
              <img
                id="toFlag"
                src="https://flagsapi.com/US/flat/64.png"
                alt="To Currency"
              />

              <select id="toCurrency" name="to"></select>
            </div>
          </div>
        </div>

        <!-- Result -->
        <div class="msg" id="result">Getting exchange rate...</div>

        <!-- Button -->
        <button type="submit" id="exchangeBtn">Get Exchange Rate</button>
      </form>
    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
